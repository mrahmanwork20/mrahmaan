
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiences | Rahman Portfolio Admin</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'DM Sans', sans-serif;
        }

        [hidden] {
            display: none !important;
        }

        .experience-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 16px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background: white;
        }

        .experience-item h3 {
            font-size: 15px;
            font-weight: 700;
            color: #111827;
        }

        .experience-item p {
            margin-top: 5px;
            color: #6b7280;
            font-size: 13px;
        }

        .item-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .item-actions button {
            padding: 8px 12px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .status {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 9px;
            border-radius: 20px;
            background: #f3f4f6;
            color: #4b5563;
            font-size: 11px;
        }

        .status.published {
            background: #dcfce7;
            color: #166534;
        }

        @media (max-width: 640px) {
            .experience-item {
                align-items: flex-start;
                flex-direction: column;
            }

            .item-actions {
                width: 100%;
            }
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-900">

    <div class="min-h-screen md:flex">

        <!-- Sidebar -->
        <aside class="w-full md:w-64 bg-gray-950 text-white p-6 flex-shrink-0">

            <h1 class="text-xl font-bold mb-8">
                RAHMAN<span class="text-yellow-500">.</span>
            </h1>

            <nav class="space-y-2 text-sm">

                <a href="index.html"
                   class="block p-3 rounded hover:bg-gray-800">
                    Dashboard
                </a>

                <a href="projects.html"
                   class="block p-3 rounded hover:bg-gray-800">
                    Projects
                </a>

                <a href="experiences.html"
                   class="block p-3 rounded bg-gray-800 text-yellow-400">
                    Experiences
                </a>

                <a href="certifications.html"
                   class="block p-3 rounded hover:bg-gray-800">
                    Certifications
                </a>

                <a href="organizations.html"
                   class="block p-3 rounded hover:bg-gray-800">
                    Organizations
                </a>

                <a href="messages.html"
                   class="block p-3 rounded hover:bg-gray-800">
                    Messages
                </a>

                <button id="logoutButton"
                    class="w-full text-left p-3 rounded text-red-400 hover:bg-gray-800 mt-8">
                    Logout
                </button>

            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 min-w-0 p-5 md:p-10">

            <!-- Header -->
            <header class="mb-8">
                <h2 class="text-2xl font-bold">Manage Experiences</h2>
                <p class="text-gray-500 text-sm mt-1">
                    Kelola pengalaman kerja dan kegiatan profesional.
                </p>
            </header>

            <!-- Add Experience -->
            <section class="bg-white rounded-xl shadow-sm p-5 mb-6">

                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">

                    <div>
                        <h3 class="font-bold text-lg">Work Experience</h3>
                        <p class="text-gray-500 text-sm mt-1">
                            Tambahkan dan kelola riwayat pengalaman profesional.
                        </p>
                    </div>

                    <button id="addButton"
                        class="bg-gray-950 text-white px-5 py-3 rounded-lg hover:bg-gray-800 text-sm font-semibold">
                        + Tambah Experience
                    </button>

                </div>

            </section>

            <!-- Experience Form -->
            <section id="formPanel"
                class="hidden bg-white rounded-xl shadow-sm p-5 mb-6">

                <h3 id="formTitle" class="font-bold text-lg mb-5">
                    Tambah Experience
                </h3>

                <form id="experienceForm">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                        <div>
                            <label for="title" class="block text-sm font-semibold mb-2">
                                Posisi / Jabatan *
                            </label>
                            <input id="title"
                                required
                                maxlength="150"
                                class="w-full border rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-yellow-400">
                        </div>

                        <div>
                            <label for="company" class="block text-sm font-semibold mb-2">
                                Perusahaan / Instansi *
                            </label>
                            <input id="company"
                                required
                                maxlength="150"
                                class="w-full border rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-yellow-400">
                        </div>

                        <div>
                            <label for="employmentType" class="block text-sm font-semibold mb-2">
                                Tipe Pengalaman
                            </label>
                            <select id="employmentType"
                                class="w-full border rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-yellow-400">

                                <option value="Full-time">Full-time</option>
                                <option value="Contract">Contract</option>
                                <option value="Internship">Internship</option>
                                <option value="Part-time">Part-time</option>
                                <option value="Volunteer">Volunteer</option>
                                <option value="Organization">Organization</option>

                            </select>
                        </div>

                        <div>
                            <label for="location" class="block text-sm font-semibold mb-2">
                                Lokasi
                            </label>
                            <input id="location"
                                placeholder="Bandar Lampung, Indonesia"
                                class="w-full border rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-yellow-400">
                        </div>

                        <div>
                            <label for="startDate" class="block text-sm font-semibold mb-2">
                                Tanggal Mulai
                            </label>
                            <input id="startDate"
                                type="date"
                                class="w-full border rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-yellow-400">
                        </div>

                        <div>
                            <label for="endDate" class="block text-sm font-semibold mb-2">
                                Tanggal Selesai
                            </label>
                            <input id="endDate"
                                type="date"
                                class="w-full border rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-yellow-400">
                        </div>

                        <div class="md:col-span-2">
                            <label for="description" class="block text-sm font-semibold mb-2">
                                Deskripsi / Tanggung Jawab
                            </label>
                            <textarea id="description"
                                rows="4"
                                class="w-full border rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-yellow-400"></textarea>
                        </div>

                        <div class="md:col-span-2 flex flex-wrap gap-5">

                            <label class="flex items-center gap-2 text-sm">
                                <input id="isCurrent"
                                    type="checkbox"
                                    class="accent-yellow-500">
                                Masih berlangsung
                            </label>

                            <label class="flex items-center gap-2 text-sm">
                                <input id="isPublished"
                                    type="checkbox"
                                    checked
                                    class="accent-yellow-500">
                                Publikasikan
                            </label>

                        </div>

                        <div>
                            <label for="sortOrder" class="block text-sm font-semibold mb-2">
                                Urutan Tampil
                            </label>
                            <input id="sortOrder"
                                type="number"
                                min="0"
                                value="0"
                                class="w-full border rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-yellow-400">
                        </div>

                    </div>

                    <div class="flex flex-wrap gap-3 mt-6">

                        <button id="saveButton"
                            type="submit"
                            class="bg-gray-950 text-white px-5 py-3 rounded-lg hover:bg-gray-800 text-sm font-semibold">
                            Simpan
                        </button>

                        <button id="cancelButton"
                            type="button"
                            class="border border-gray-300 px-5 py-3 rounded-lg hover:bg-gray-100 text-sm font-semibold">
                            Batal
                        </button>

                    </div>

                    <p id="formMessage"
                        role="status"
                        class="text-gray-500 text-sm mt-4">
                    </p>

                </form>

            </section>

            <!-- Experience List -->
            <section class="bg-white rounded-xl shadow-sm p-5">

                <h3 class="font-bold text-lg mb-5">
                    Daftar Experiences
                </h3>

                <div id="experienceList" class="space-y-4">
                </div>

                <p id="listMessage"
                    role="status"
                    class="text-gray-500 text-sm mt-4">
                    Memuat data...
                </p>

            </section>

        </main>
    </div>

    <script type="module" src="../js/admin-experiences.js"></script>

</body>
</html>
