
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Muhammad Rahman</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #101010;
            color: #fff;
            font-family: 'DM Sans', sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 16px;
        }

        .brand {
            margin-bottom: 32px;
        }

        .brand span {
            color: #d5ad60;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        h1 {
            margin-top: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
        }

        .subtitle {
            margin-top: 8px;
            color: #999;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-top: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 13px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #252525;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #d5ad60;
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #d5ad60;
            color: #101010;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
        }

        #message.error {
            display: block;
            background: #492525;
            color: #ffbaba;
        }

        #message.success {
            display: block;
            background: #24452e;
            color: #b8f5c5;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: #999;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: #d5ad60;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="brand">
            <span>MUHAMMAD RAHMAN</span>
            <h1>Admin Login</h1>
            <p class="subtitle">
                Masuk untuk mengelola konten personal portfolio.
            </p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Masukkan email admin"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    required
                >
            </div>

            <button type="submit" id="loginButton">
                MASUK KE DASHBOARD
            </button>

            <div id="message" role="alert"></div>
        </form>

        <a href="../index.html" class="back-link">
            ← Kembali ke Portfolio
        </a>
    </main>

    <script type="module" src="../js/admin-auth.js"></script>
</body>
</html>
